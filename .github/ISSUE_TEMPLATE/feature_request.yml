name: Feature request
description: Suggest an improvement or new capability.
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user need or workflow should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Schema extensions
        - Directory extensions
        - Tools / usage monitor
        - Tools / audit log
        - Tools / validation
        - Manifest snippets
        - Authentication / permissions
        - Deployment / documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround or alternative approach you considered.
  - type: textarea
    id: privacy
    attributes:
      label: Privacy or data-handling impact
      description: Note whether the feature requires backend storage, telemetry, caching, additional permissions, or data export.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, links, or related Graph documentation.